name: 同步 YouTube 新歌

on:
  schedule:
    # 每週一、四 台灣時間 09:17（cron 使用 UTC）
    - cron: "17 1 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 讀取頻道並更新清單
        id: sync
        run: node scripts/sync-youtube.js
      - name: 發布更新
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalog.js song-audio.js audio/songs
          if ! git diff --cached --quiet; then
            git commit -m "$SUMMARY"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3888000 ]; then
            # GitHub 會停用 60 天沒有活動的排程，45 天沒更新就留一筆紀錄維持運作
            git commit --allow-empty -m "維持自動同步運作"
            git push
          fi
